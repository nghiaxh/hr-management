name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/hr-test
          JWT_SECRET: test-jwt-secret-ci
          JWT_EXPIRES_IN: 1d
          CORS_ORIGIN: http://localhost:5173

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm test

  client-build:
    name: Client Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start server & client
        run: |
          cd ../server && echo "MONGODB_URI=mongodb://localhost:27017/hr-test" > .env && echo "JWT_SECRET=test-jwt-secret-ci" >> .env && echo "JWT_EXPIRES_IN=1d" >> .env && echo "CORS_ORIGIN=http://localhost:5173" >> .env && npm run seed && npm run dev &
          sleep 5
          npm run dev &
          sleep 5
        shell: bash

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
