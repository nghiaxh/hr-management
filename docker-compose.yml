services:
  mongodb:
    image: mongo:8
    container_name: hr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hr-management
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hr-network
    labels:
      - "app=hr-management"
      - "service=mongodb"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hr-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/hr-management
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hr-network
    labels:
      - "app=hr-management"
      - "service=server"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  hr-network:
    driver: bridge

volumes:
  mongodb_data:
